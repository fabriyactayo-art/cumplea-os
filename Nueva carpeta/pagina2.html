<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorpresa 🖤</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            background-color: black;

            overflow: hidden;

        }


        /* VIDEO */

        video {

    width: 100vw;
    height: 100vh;

    object-fit: contain;
    object-position: center center;

    display: block;
    margin: 0 auto;

    background: rgb(250, 250, 250);
}
           
  


        /* BOTÓN SONIDO */

        #sonido {

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            padding: 18px 30px;

            font-size: 22px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            z-index: 100;

        }


        /* BOTÓN REGRESAR */

        #regresar {

            position: fixed;

            top: 25px;

            left: 25px;

            padding: 12px 20px;

            font-size: 18px;

            border: none;

            border-radius: 15px;

            cursor: pointer;

            z-index: 100;

        }


        /* MENSAJE */

        #mensaje {

            position: fixed;

            bottom: 45px;

            left: 50%;

            transform: translateX(-50%) scale(0);

            width: 100%;

            text-align: center;

            color: rgb(10, 10, 10);

            font-family: Arial, sans-serif;

            font-size: clamp(50px, 8vw, 120px);

            font-weight: 900;

            z-index: 90;

            opacity: 0;

            pointer-events: none;

        }


        /* ANIMACIÓN MENSAJE */

        #mensaje.mostrar {

            animation: aparecerMensaje 3s ease-in-out infinite;

        }


        @keyframes aparecerMensaje {

            0% {

                transform: translateX(-50%) scale(0.7);

                opacity: 0.5;

            }

            50% {

                transform: translateX(-50%) scale(1.3);

                opacity: 1;

            }

            100% {

                transform: translateX(-50%) scale(0.7);

                opacity: 0.5;

            }

        }


        /* FUEGOS */

        .particula {

            position: fixed;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: white;

            z-index: 80;

            pointer-events: none;

            box-shadow:

                0 0 6px white,

                0 0 12px white;

            animation: volar 1.8s ease-out forwards;

        }


        @keyframes volar {

            0% {

                transform: translate(0, 0) scale(1);

                opacity: 1;

            }

            70% {

                opacity: 1;

            }

            100% {

                transform: translate(var(--x), var(--y)) scale(0);

                opacity: 0;

            }

        }

    </style>

</head>


<body>


    <!-- VIDEO -->

    <video id="video" autoplay muted playsinline loop>

        <source src="BEBE.mp4" type="video/mp4">

    </video>


    <!-- SONIDO -->

    <button id="sonido">

        🔊 ACTIVAR SONIDO

    </button>


    <!-- REGRESAR -->

    <button id="regresar">

        ← Regresar

    </button>


    <!-- MENSAJE -->

    <div id="mensaje">

        ME VALE VERGA 💀

    </div>


    <script>


        const video = document.getElementById("video");

        const botonSonido = document.getElementById("sonido");

        const botonRegresar = document.getElementById("regresar");

        const mensaje = document.getElementById("mensaje");


        /* =========================
           SONIDO
        ========================= */

        botonSonido.addEventListener("click", function () {

            video.muted = false;

            video.volume = 1;

            video.play();

            botonSonido.style.display = "none";

        });


        /* =========================
           REGRESAR
        ========================= */

        let intentosRegresar = 0;


        botonRegresar.addEventListener("mouseover", function () {

            if (intentosRegresar < 5) {

                intentosRegresar++;


                const anchoPantalla = window.innerWidth;

                const altoPantalla = window.innerHeight;

                const anchoBoton = botonRegresar.offsetWidth;

                const altoBoton = botonRegresar.offsetHeight;


                const x = Math.random() *

                    (anchoPantalla - anchoBoton);


                const y = Math.random() *

                    (altoPantalla - altoBoton);


                botonRegresar.style.left = x + "px";

                botonRegresar.style.top = y + "px";

            }

        });


        /* =========================
           CLICK REGRESAR
        ========================= */

        botonRegresar.addEventListener("click", function () {

            if (intentosRegresar >= 5) {

                window.location.href = "index.html";

            }

        });


        /* =========================
           MENSAJE
        ========================= */

        setTimeout(function () {

            mensaje.classList.add("mostrar");

            setInterval(crearExplosion, 600);

        }, 5000);


        /* =========================
           FUEGOS
        ========================= */

        function crearExplosion() {


            const centroX =

                Math.random() *

                window.innerWidth;


            const centroY =

                Math.random() *

                window.innerHeight;


            for (let i = 0; i < 50; i++) {


                const particula =

                    document.createElement("div");


                particula.classList.add("particula");


                particula.style.left =

                    centroX + "px";


                particula.style.top =

                    centroY + "px";


                const angulo =

                    Math.random() *

                    Math.PI * 2;


                const distancia =

                    80 +

                    Math.random() *

                    200;


                const x =

                    Math.cos(angulo) *

                    distancia;


                const y =

                    Math.sin(angulo) *

                    distancia;


                particula.style.setProperty(

                    "--x",

                    x + "px"

                );


                particula.style.setProperty(

                    "--y",

                    y + "px"

                );


                const tamaño =

                    3 +

                    Math.random() *

                    6;


                particula.style.width =

                    tamaño + "px";


                particula.style.height =

                    tamaño + "px";


                document.body.appendChild(

                    particula

                );


                setTimeout(function () {

                    particula.remove();

                }, 1800);

            }

        }


    </script>

</body>

</html>
